<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tora.byka - POS & Kitchen</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --accent: #10b981;
            --border: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

        /* Keyframe Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeOutSlide {
            to { opacity: 0; transform: translateX(20px); }
        }

        .animate-fade { animation: fadeInUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-pop { animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* Top Header */
        header {
            background: #0f172a;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .brand { font-size: 1.5rem; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
        .brand span { color: #818cf8; }

        /* Navigation Pills */
        nav { display: flex; gap: 8px; background: #1e293b; padding: 4px; border-radius: 99px; }
        nav button {
            background: none; border: none; padding: 8px 20px; font-size: 0.9rem;
            font-weight: 600; color: #94a3b8; cursor: pointer; transition: all 0.25s ease;
            border-radius: 99px;
        }
        nav button.active { background: var(--primary); color: #fff; }

        /* Main Container */
        .container { max-width: 1300px; margin: 2rem auto; padding: 0 1.5rem; }
        .section { display: none; }
        .section.active { display: block; }

        /* Layout Kasir */
        .kasir-grid { display: grid; grid-template-columns: 1fr 380px; gap: 2rem; align-items: start; }
        @media (max-width: 1024px) { .kasir-grid { grid-template-columns: 1fr; } }

        .section-header { margin-bottom: 1.5rem; }
        .section-title { font-size: 1.25rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .section-title::before { content: ''; width: 4px; height: 18px; background: var(--primary); border-radius: 4px; }

        /* Menu Grid Card */
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.25rem; margin-bottom: 2rem; }
        .menu-card {
            background: var(--surface); border-radius: var(--radius-lg); overflow: hidden;
            border: 1px solid var(--border); box-shadow: var(--shadow-sm); transition: all 0.25s ease;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .menu-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: #cbd5e1; }
        .menu-img-container { width: 100%; height: 120px; overflow: hidden; background: #f1f5f9; }
        .menu-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .menu-card:hover .menu-img { transform: scale(1.05); }
        .menu-content { padding: 1rem; }
        .menu-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.25rem; }
        .menu-price { color: var(--primary); font-weight: 800; font-size: 1.05rem; }
        .btn-add-item {
            width: 100%; background: #f1f5f9; color: var(--text-main); border: none;
            padding: 10px; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: all 0.2s ease;
            border-top: 1px solid var(--border);
        }
        .btn-add-item:active { transform: scale(0.98); }
        .menu-card:hover .btn-add-item { background: var(--primary); color: white; }

        /* Order Cart Sidebar & Inputs */
        .cart-panel {
            background: var(--surface); border-radius: var(--radius-lg); padding: 1.5rem;
            border: 1px solid var(--border); box-shadow: var(--shadow-md); position: sticky; top: 90px;
        }
        .cart-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
        .cart-title { font-weight: 700; font-size: 1.1rem; }

        .form-group { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .form-label { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .form-input, .form-select {
            padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-md);
            font-size: 0.9rem; font-weight: 600; outline: none; transition: border-color 0.2s;
            background: #f8fafc;
        }
        .form-input:focus, .form-select:focus { border-color: var(--primary); background: #fff; }

        .cart-list { list-style: none; margin: 1rem 0; max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.9rem; }
        .cart-item-info { display: flex; flex-direction: column; }
        .cart-item-name { font-weight: 600; }
        .cart-item-price { font-size: 0.8rem; color: var(--text-muted); }
        .cart-controls { display: flex; align-items: center; gap: 8px; }
        .btn-qty { background: #e2e8f0; border: none; width: 24px; height: 24px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .btn-qty:hover { background: #cbd5e1; }

        .cart-summary { border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 1rem; }
        .summary-row { display: flex; justify-content: space-between; font-weight: 800; font-size: 1.1rem; margin-bottom: 1rem; }
        .btn-checkout {
            width: 100%; background: var(--primary); color: white; border: none;
            padding: 14px; border-radius: var(--radius-md); font-weight: 700; font-size: 0.95rem;
            cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .btn-checkout:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-checkout:active { transform: translateY(0); }

        /* Layout Dapur */
        .kitchen-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
        .kitchen-card {
            background: var(--surface); border-radius: var(--radius-lg); padding: 1.25rem;
            border: 1px solid var(--border); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; justify-content: space-between;
            transition: all 0.3s ease;
        }
        .kitchen-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .order-badge { background: #e0e7ff; color: var(--primary); padding: 4px 10px; border-radius: 99px; font-weight: 700; font-size: 0.8rem; }
        .order-type-badge { background: #fef3c7; color: #d97706; padding: 4px 10px; border-radius: 99px; font-weight: 700; font-size: 0.75rem; }
        .customer-info { margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
        .customer-name { font-weight: 800; font-size: 1.05rem; color: var(--text-main); }
        .order-time { font-size: 0.75rem; color: var(--text-muted); }

        .kitchen-items { list-style: none; margin-bottom: 1.25rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .kitchen-items li { font-weight: 600; font-size: 0.95rem; display: flex; justify-content: space-between; }
        .btn-done {
            width: 100%; background: var(--accent); color: white; border: none;
            padding: 10px; border-radius: var(--radius-md); font-weight: 700; font-size: 0.9rem;
            cursor: pointer; transition: background 0.2s;
        }
        .btn-done:hover { background: #059669; }
    </style>
</head>
<body>

<header>
    <div class="brand">tora<span>.byka</span></div>
    <nav>
        <button class="active" onclick="showSection(event, 'kasir')">Kasir</button>
        <button onclick="showSection(event, 'dapur')">Dapur</button>
    </nav>
</header>

<div class="container">
    <!-- LAYAR KASIR -->
    <div id="kasir" class="section active animate-fade">
        <div class="kasir-grid">
            <!-- Menu Area -->
            <div>
                <div class="section-header">
                    <div class="section-title">HTS (Hungry To Sandwich)</div>
                </div>
                <div class="menu-grid">
                    <div class="menu-card">
                        <div class="menu-img-container">
                            <img src="https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=400&auto=format&fit=crop" class="menu-img">
                        </div>
                        <div class="menu-content">
                            <div class="menu-title">HTS Common</div>
                            <div class="menu-price">Rp 10.000</div>
                        </div>
                        <button class="btn-add-item" onclick="tambahPesanan('HTS Common', 10000)">+ Tambah</button>
                    </div>
                    <div class="menu-card">
                        <div class="menu-img-container">
                            <img src="https://images.unsplash.com/photo-1553909489-cd47e0907980?w=400&auto=format&fit=crop" class="menu-img">
                        </div>
                        <div class="menu-content">
                            <div class="menu-title">HTS Double</div>
                            <div class="menu-price">Rp 13.000</div>
                        </div>
                        <button class="btn-add-item" onclick="tambahPesanan('HTS Double', 13000)">+ Tambah</button>
                    </div>
                    <div class="menu-card">
                        <div class="menu-img-container">
                            <img src="https://images.unsplash.com/photo-1509722747041-616f39b57569?w=400&auto=format&fit=crop" class="menu-img">
                        </div>
                        <div class="menu-content">
                            <div class="menu-title">HTS Monster</div>
                            <div class="menu-price">Rp 15.000</div>
                        </div>
                        <button class="btn-add-item" onclick="tambahPesanan('HTS Monster', 15000)">+ Tambah</button>
                    </div>
                </div>

                <div class="section-header">
                    <div class="section-title">Snack</div>
                </div>
                <div class="menu-grid">
                    <div class="menu-card">
                        <div class="menu-img-container">
                            <img src="https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=400&auto=format&fit=crop" class="menu-img">
                        </div>
                        <div class="menu-content">
                            <div class="menu-title">Martabak Mesir</div>
                            <div class="menu-price">Rp 5.000</div>
                        </div>
                        <button class="btn-add-item" onclick="tambahPesanan('Martabak Mesir', 5000)">+ Tambah</button>
                    </div>
                </div>

                <div class="section-header">
                    <div class="section-title">LDR (Beverages)</div>
                </div>
                <div class="menu-grid">
                    <div class="menu-card">
                        <div class="menu-img-container">
                            <img src="https://images.unsplash.com/photo-1553530666-ba11a7da3888?w=400&auto=format&fit=crop" class="menu-img">
                        </div>
                        <div class="menu-content">
                            <div class="menu-title">LDR Mango Smoothies</div>
                            <div class="menu-price">Rp 8.000</div>
                        </div>
                        <button class="btn-add-item" onclick="tambahPesanan('LDR Mango Smoothies', 8000)">+ Tambah</button>
                    </div>
                    <div class="menu-card">
                        <div class="menu-img-container">
                            <img src="https://images.unsplash.com/photo-1572490122747-3968b75cc699?w=400&auto=format&fit=crop" class="menu-img">
                        </div>
                        <div class="menu-content">
                            <div class="menu-title">LDR Friendzone Creamy</div>
                            <div class="menu-price">Rp 8.000</div>
                        </div>
                        <button class="btn-add-item" onclick="tambahPesanan('LDR Friendzone Creamy', 8000)">+ Tambah</button>
                    </div>
                </div>
            </div>

            <!-- Cart Sidebar -->
            <div class="cart-panel">
                <div class="cart-header">
                    <div class="cart-title">Detail Pesanan</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Nama Pelanggan</label>
                    <input type="text" id="cust-name" class="form-input" placeholder="Masukkan nama..." autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="form-label">Tipe Pesanan</label>
                    <select id="order-type" class="form-select">
                        <option value="Dine In">Dine In (Makan di Tempat)</option>
                        <option value="Take Away">Take Away (Bungkus)</option>
                    </select>
                </div>

                <ul id="daftar-pesanan" class="cart-list"></ul>

                <div class="cart-summary">
                    <div class="summary-row">
                        <span>Total:</span>
                        <span id="total-harga">Rp 0</span>
                    </div>
                    <button class="btn-checkout" onclick="kirimKeDapur()">Kirim ke Dapur 🔥</button>
                </div>
            </div>
        </div>
    </div>

    <!-- LAYAR DAPUR -->
    <div id="dapur" class="section">
        <div class="section-header">
            <div class="section-title">Pesanan Masuk Dapur</div>
        </div>
        <div id="daftar-dapur" class="kitchen-grid">
            <p id="empty-kitchen-msg" style="color: var(--text-muted); font-style: italic;">Belum ada pesanan aktif...</p>
        </div>
    </div>
</div>

<script>
    let keranjang = [];
    let nomorAntrean = 1;

    function showSection(event, sectionId) {
        document.querySelectorAll('.section').forEach(el => {
            el.classList.remove('active', 'animate-fade');
        });
        document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
        
        const targetSection = document.getElementById(sectionId);
        targetSection.classList.add('active', 'animate-fade');
        event.target.classList.add('active');
    }

    function tambahPesanan(nama, harga) {
        let itemIndex = keranjang.findIndex(item => item.nama === nama);
        if (itemIndex > -1) {
            keranjang[itemIndex].qty += 1;
        } else {
            keranjang.push({ nama, harga, qty: 1 });
        }
        renderPesananKasir();
    }

    function ubahQty(index, delta) {
        keranjang[index].qty += delta;
        if (keranjang[index].qty <= 0) {
            keranjang.splice(index, 1);
        }
        renderPesananKasir();
    }

    function renderPesananKasir() {
        const list = document.getElementById('daftar-pesanan');
        const totalEl = document.getElementById('total-harga');
        list.innerHTML = '';
        
        let total = 0;
        if (keranjang.length === 0) {
            list.innerHTML = '<li style="color: var(--text-muted); text-align: center; padding: 1rem 0;">Belum ada menu dipilih</li>';
            totalEl.textContent = 'Rp 0';
            return;
        }

        keranjang.forEach((item, index) => {
            let subtotal = item.harga * item.qty;
            total += subtotal;
            let li = document.createElement('li');
            li.className = 'cart-item animate-pop';
            li.innerHTML = `
                <div class="cart-item-info">
                    <span class="cart-item-name">${item.nama}</span>
                    <span class="cart-item-price">Rp ${item.harga.toLocaleString('id-ID')}</span>
                </div>
                <div class="cart-controls">
                    <button class="btn-qty" onclick="ubahQty(${index}, -1)">-</button>
                    <span style="font-weight:700;">${item.qty}</span>
                    <button class="btn-qty" onclick="ubahQty(${index}, 1)">+</button>
                </div>
            `;
            list.appendChild(li);
        });

        totalEl.textContent = `Rp ${total.toLocaleString('id-ID')}`;
    }

    function kirimKeDapur() {
        const custNameInput = document.getElementById('cust-name');
        const orderTypeInput = document.getElementById('order-type');
        const custName = custNameInput.value.trim();

        if (!custName) {
            alert('Mohon isi nama pelanggan terlebih dahulu!');
            custNameInput.focus();
            return;
        }

        if (keranjang.length === 0) {
            alert('Pilih menu terlebih dahulu!');
            return;
        }

        const daftarDapur = document.getElementById('daftar-dapur');
        const emptyMsg = document.getElementById('empty-kitchen-msg');
        if (emptyMsg) emptyMsg.remove();

        let listHTML = '';
        keranjang.forEach(item => {
            listHTML += `<li><span>${item.nama}</span> <span>x${item.qty}</span></li>`;
        });

        const orderCard = document.createElement('div');
        orderCard.className = 'kitchen-card animate-pop';
        orderCard.innerHTML = `
            <div>
                <div class="kitchen-card-header">
                    <span class="order-badge">Antrean #${nomorAntrean}</span>
                    <span class="order-type-badge">${orderTypeInput.value}</span>
                </div>
                <div class="customer-info">
                    <div class="customer-name">${custName}</div>
                    <div class="order-time">${new Date().toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'})} WIB</div>
                </div>
                <ul class="kitchen-items">${listHTML}</ul>
            </div>
            <button class="btn-done" onclick="tandaiSelesai(this)">Selesai Siap Saji ✓</button>
        `;

        daftarDapur.appendChild(orderCard);
        
        // Reset Cart & Form
        keranjang = [];
        custNameInput.value = '';
        renderPesananKasir();
        nomorAntrean++;
    }

    function tandaiSelesai(button) {
        const card = button.closest('.kitchen-card');
        card.style.animation = 'fadeOutSlide 0.3s forwards';
        
        setTimeout(() => {
            card.remove();
            const daftarDapur = document.getElementById('daftar-dapur');
            if (daftarDapur.children.length === 0) {
                daftarDapur.innerHTML = '<p id="empty-kitchen-msg" style="color: var(--text-muted); font-style: italic;">Belum ada pesanan aktif...</p>';
            }
        }, 300);
    }

    renderPesananKasir();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tora.byka - Sistem Kasir & Dapur</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; color: #333; }
        header { background: #2c3e50; color: white; padding: 1.5rem; text-align: center; }
        header h1 { margin: 0; font-size: 2rem; letter-spacing: 2px; }
        nav { display: flex; justify-content: center; background: #34495e; }
        nav button { background: none; border: none; color: white; padding: 1rem 3rem; cursor: pointer; font-size: 1.1rem; font-weight: bold; transition: 0.3s; }
        nav button:hover, nav button.active { background: #e74c3c; }
        .container { padding: 2rem; max-width: 800px; margin: auto; }
        .section { display: none; }
        .section.active { display: block; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: white; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .order-card { background: white; padding: 20px; border-left: 6px solid #e74c3c; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button.btn { background: #27ae60; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; transition: 0.3s; }
        button.btn:hover { background: #2ecc71; }
        button.btn-danger { background: #c0392b; margin-top: 10px; }
        button.btn-danger:hover { background: #e74c3c; }
        ul { padding-left: 20px; }
    </style>
</head>
<body>

<header>
    <h1>tora.byka</h1>
</header>

<nav>
    <button class="active" onclick="showSection(event, 'kasir')">Kasir</button>
    <button onclick="showSection(event, 'dapur')">Dapur</button>
</nav>

<div class="container">
    <!-- Halaman Kasir -->
    <div id="kasir" class="section active">
        <h2>Mode Kasir</h2>
        <div class="menu-item">
            <span>Kopi Susu Tora - <strong>Rp 18.000</strong></span>
            <button class="btn" onclick="tambahPesanan('Kopi Susu Tora')">Tambah</button>
        </div>
        <div class="menu-item">
            <span>Roti Bakar Byka - <strong>Rp 25.000</strong></span>
            <button class="btn" onclick="tambahPesanan('Roti Bakar Byka')">Tambah</button>
        </div>
        <div class="menu-item">
            <span>Kentang Goreng - <strong>Rp 15.000</strong></span>
            <button class="btn" onclick="tambahPesanan('Kentang Goreng')">Tambah</button>
        </div>
        
        <h3 style="margin-top: 30px;">Draf Pesanan:</h3>
        <ul id="daftar-pesanan"></ul>
        <button class="btn" onclick="kirimKeDapur()" style="width: 100%; font-size: 1.1rem; padding: 15px;">Kirim ke Dapur</button>
    </div>

    <!-- Halaman Dapur -->
    <div id="dapur" class="section">
        <h2>Mode Dapur</h2>
        <div id="daftar-dapur">
            <p style="color: #7f8c8d; font-style: italic;">Belum ada pesanan yang masuk...</p>
        </div>
    </div>
</div>

<script>
    let pesananSementara = [];
    let nomorAntrean = 1;

    // Fungsi untuk berpindah tab Kasir / Dapur
    function showSection(event, sectionId) {
        document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
        document.getElementById(sectionId).classList.add('active');
        event.target.classList.add('active');
    }

    // Fungsi menambahkan item ke keranjang kasir
    function tambahPesanan(item) {
        pesananSementara.push(item);
        renderPesananKasir();
    }

    // Fungsi menampilkan daftar pesanan di layar kasir
    function renderPesananKasir() {
        const list = document.getElementById('daftar-pesanan');
        list.innerHTML = '';
        pesananSementara.forEach(item => {
            let li = document.createElement('li');
            li.textContent = item;
            list.appendChild(li);
        });
    }

    // Fungsi mengirim data dari Kasir ke Dapur
    function kirimKeDapur() {
        if (pesananSementara.length === 0) {
            alert('Belum ada menu yang dipilih!');
            return;
        }

        const daftarDapur = document.getElementById('daftar-dapur');
        
        // Hapus teks "Belum ada pesanan" jika ini pesanan pertama
        if (nomorAntrean === 1 && daftarDapur.innerHTML.includes('Belum ada pesanan')) {
            daftarDapur.innerHTML = '';
        }

        // Buat kartu pesanan untuk dapur
        const orderCard = document.createElement('div');
        orderCard.className = 'order-card';
        orderCard.innerHTML = `
            <h3 style="margin-top: 0;">Antrean #${nomorAntrean}</h3>
            <ul>` + pesananSementara.map(item => `<li>${item}</li>`).join('') + `</ul>
            <button class="btn btn-danger" onclick="tandaiSelesai(this)">Pesanan Selesai</button>
        `;
        
        daftarDapur.appendChild(orderCard);
        
        // Reset draf pesanan kasir
        pesananSementara = [];
        renderPesananKasir();
        nomorAntrean++;
        alert('Pesanan berhasil dikirim ke layar Dapur!');
    }

    // Fungsi untuk menghapus pesanan di layar dapur jika sudah selesai
    function tandaiSelesai(button) {
        const card = button.parentElement;
        card.remove();
        
        const daftarDapur = document.getElementById('daftar-dapur');
        if (daftarDapur.children.length === 0) {
            daftarDapur.innerHTML = '<p style="color: #7f8c8d; font-style: italic;">Belum ada pesanan yang masuk...</p>';
        }
    }
</script>
</body>
</html>
